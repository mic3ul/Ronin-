name: Python checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install aiogram "yt-dlp>=2025.1.15" pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_youtube.py
      - name: Compile Python files
        run: python -m compileall -q handlers services
